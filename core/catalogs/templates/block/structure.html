{% extends 'form.html' %}
{% load static %}

{% block assets_form %}
<script src="{% static 'block/js/structure.js' %}"></script>
{% endblock %}

{% block form_fields %}

<div class="card shadow-sm">

    <div class="card-header">

        <h4>
            <i class="fas fa-layer-group"></i>
            Crear estructura de bloque
        </h4>

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6 mb-3">

                <label>Código</label>

                {{ form.code }}

            </div>

            <div class="col-md-6 mb-3">

                <label>Nombre</label>

                {{ form.name }}

            </div>

        </div>

        <div class="row">

            <div class="col-md-3 mb-3">

                <label>Naves</label>

                {{ form.bay_quantity }}

            </div>

            <div class="col-md-3 mb-3">

                <label>Camas por nave</label>

                {{ form.bed_quantity }}

            </div>

            <div class="col-md-3 mb-3">

                <label>Cuadros por cama</label>

                {{ form.section_quantity }}

            </div>

            <div class="col-md-3">

                <div class="form-check mt-4">

                    {{ form.has_sides }}

                    <label class="form-check-label">

                        Lado A y B

                    </label>

                </div>

            </div>

        </div>

        <hr>

        <button
            type="button"
            class="btn btn-primary btnPreview">

            <i class="fas fa-eye"></i>

            Vista previa

        </button>

    </div>

</div>

<div
    id="preview"
    class="mt-4">

</div>

{% endblock %}
