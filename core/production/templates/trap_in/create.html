{% extends 'form.html' %}
{% load static %}

{% block assets %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'trap_in/css/create.css' %}">
    <script src="{% static 'trap_in/js/create.js' %}"></script>
{% endblock %}

{% block form_fields %}
<div>
    <!-- 1. Selectores en Cascada: Fecha, Bloque y Trampa -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3 mb-md-0">
            <label>Fecha de lectura:</label>
            <input type="date" name="date_reading" class="form-control shadow-sm" value="{{ 'now'|date:'Y-m-d' }}" required>
        </div>
        
        <div class="col-md-4 mb-3 mb-md-0">
            <label>Bloque:</label>
            <select id="select_block" class="form-control shadow-sm select2">
                <option value="">--------- Seleccione un bloque ---------</option>
                {% for block in blocks %}
                <option value="{{ block.id }}">{{ block.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-4">
            <label>Trampa:</label>
            <select id="select_trap" name="trap_in_id" class="form-control shadow-sm select2" disabled>
                <option value="">--------- Seleccione primero un bloque ---------</option>
            </select>
        </div>
    </div>

    <!-- 2. Contenedor Dinámico con Tarjetas y Observación General -->
    <div id="matrix_container" style="display: none;">
        <hr class="my-4">
        <h5 class="mb-3 text-dark font-weight-bold"><i class="fas fa-th-large text-primary mr-2"></i> Registro por Blanco Biológico</h5>
        
        <div class="targets-grid-box">
            {% for target in biological_targets %}
            <div class="target-card-item">
                <!-- Título del Blanco Biológico -->
                <div class="target-card-title">
                    {{ target.name }}
                </div>
                
                <!-- Fila principal: Botón (-) a la izquierda, Input al centro, Botón (+) a la derecha -->
                <div class="input-controls-row">
                    <button type="button" class="qty-btn btn-dec" data-action="dec">-</button>
                    <input type="number" name="qty_{{ target.id }}" class="form-control input-qty" value="0" min="0">
                    <button type="button" class="qty-btn btn-inc" data-action="inc">+</button>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Campo de Observación General para la Trampa -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm border-0 p-3 bg-light">
                    <label for="general_observation" class="font-weight-bold text-dark mb-2">
                        <i class="fas fa-comment-alt text-primary mr-2"></i> Observación General de la Trampa:
                    </label>
                    <textarea id="general_observation" name="observation" class="form-control" rows="3" placeholder="Ingrese observaciones generales sobre la lectura de esta trampa..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
