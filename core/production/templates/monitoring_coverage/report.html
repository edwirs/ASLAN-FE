{% extends 'report.html' %}
{% load static %}

{% block assets_report %}
    <!-- Daterangepicker -->
    <link rel="stylesheet" href="{% static 'lib/bootstrap-daterangepicker-3.1/css/daterangepicker.css' %}"/>
    <script src="{% static 'lib/bootstrap-daterangepicker-3.1/js/daterangepicker.js' %}"></script>
    <script src="{% static 'lib/bootstrap-daterangepicker-3.1/js/spanish.js' %}"></script>
    
    <!-- Highcharts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/10.3.3/highcharts.min.js"></script>
    
    <!-- Tu archivo JS -->
    <script src="{% static 'monitoring_coverage/js/report.js' %}"></script>
{% endblock %}

{% block content_report %}
<div class="container-fluid">
    <div class="row align-items-end mb-4">
        <div class="col-lg-4">
            <label class="fw-bold">Rango de fechas:</label>
            <div class="input-group">
                <input type="text" name="date_range" class="form-control" readonly>
                <button class="btn btn-primary" id="btnSearch" type="button">
                    <i class="fas fa-search"></i> Consultar
                </button>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-lg-12">
            <div id="graph_container" style="width: 100%; height: 500px;"></div>
        </div>
    </div>
</div>
{% endblock %}
