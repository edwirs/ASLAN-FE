{% extends 'form.html' %}
{% load static %}
{% load widget_tweaks %}

{% block content %}
<form method="post"
      enctype="multipart/form-data"
      id="frmForm">

    {% csrf_token %}

    <input type="hidden"
           name="action"
           value="{{ action }}">

    <div class="card">

        <div class="card-header">
            <h3 class="card-title">
                {{ title }}
            </h3>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label>Archivo Excel</label>
                {{ form.file|add_class:'form-control' }}
            </div>

        </div>

        <div class="card-footer">

            <button type="submit"
                    class="btn btn-primary">
                <i class="fas fa-save"></i>
                Guardar
            </button>

            <a href="{{ list_url }}"
               class="btn btn-secondary">
                Cancelar
            </a>

        </div>

    </div>

</form>
{% endblock %}

{% block javascript %}
<script src="{% static 'plant_inventory_import/js/form.js' %}"></script>
{% endblock %}
