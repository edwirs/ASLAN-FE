{% extends 'list.html' %}
{% load static %}

{% block assets_list %}
    <script src="{% static 'plant_inventory/js/list.js' %}"></script>
{% endblock %}

{% block columns %}
    <th>Código</th>
    <th>Plot ID</th>
    <th>Localización</th>
    <th>Variedad</th>
    <th>Género</th>
    <th>Área</th>
    <th>Plantas</th>
{% endblock %}

{% block content_list %}
<form id="csrfForm" style="display:none;">
    {% csrf_token %}
</form>
<div class="row align-items-end">

<div class="card mb-4">
    <div class="card-body">

        <div class="row align-items-end">

            <div class="col-md-2">
                <label>Código</label>
                <input type="text" id="code" class="form-control">
            </div>

            <div class="col-md-2">
                <label>Plot ID</label>
                <input type="text" id="plot_id" class="form-control">
            </div>

            <div class="col-md-2">
                <label>Localización</label>
                <input type="text" id="location" class="form-control">
            </div>

            <div class="col-md-2">
                <label>Género</label>
                <input type="text" id="genus" class="form-control">
            </div>

            <div class="col-md-2">
                <label>Área</label>
                <input type="text" id="area" class="form-control">
            </div>

            <div class="col-md-2">
                <button type="button"
                        class="btn btn-primary w-100 btnSearch">
                    <i class="fas fa-search"></i>
                    Buscar
                </button>
            </div>

        </div>

    </div>
</div>

{% endblock %}
