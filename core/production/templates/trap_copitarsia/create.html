{% extends 'form.html' %}
{% load static %}

{% block form_fields %}
<div class="row">
    <!-- Fecha: Reducida a 4 columnas en desktop, 12 en móvil -->
    <div class="col-md-4 col-lg-3">
        <div class="form-group">
            <label>Fecha de lectura:</label>
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                </div>
                <input type="date" name="date_reading" class="form-control" value="{{ 'now'|date:'Y-m-d' }}" required>
            </div>
        </div>
    </div>
</div>

<hr>

<!-- Título de sección -->
<h5 class="mb-3 text-secondary"><i class="fas fa-bug"></i> Registro por Trampa</h5>

<!-- Detalle por trampa: Diseño tipo Grid optimizado -->
<div class="row">
    {% for trap in traps %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-body py-2 px-3">
                <label class="small font-weight-bold text-muted mb-1 d-block">{{ trap.name }}</label>
                <div class="input-group input-group-sm">
                    <input type="number" name="quantity_{{ trap.id }}" class="form-control text-center" 
                           placeholder="0" min="0" style="border-radius: 4px;">
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Observaciones -->
<div class="row mt-3">
    <div class="col-lg-12">
        <div class="form-group">
            <label>Observaciones:</label>
            <textarea name="observation" class="form-control" rows="2" 
                      placeholder="Alguna novedad relevante..."></textarea>
        </div>
    </div>
</div>
{% endblock %}

{% block javascript %}
<script>
    // Usamos el ID estándar de los formularios MIPE
    $('#frmForm').on('submit', function(e) {
        e.preventDefault();
        
        // Validación básica simple
        var formData = new FormData(this);
        
        $.ajax({
            url: window.location.pathname,
            type: 'POST',
            data: formData,
            dataType: 'json',
            processData: false,
            contentType: false,
            beforeSend: function() {
                // Opcional: mostrar un spinner de carga aquí
            }
        }).done(function(data) {
            if (!data.hasOwnProperty('error')) {
                // Notificación visual profesional
                Swal.fire({
                    title: '¡Éxito!',
                    text: 'Lecturas registradas correctamente.',
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "{{ list_url }}";
                });
                return false;
            }
            Swal.fire('Error', data.error, 'error');
        }).fail(function(jqXHR, textStatus, errorThrown) {
            Swal.fire('Error', textStatus + ': ' + errorThrown, 'error');
        });
    });
</script>
{% endblock %}
