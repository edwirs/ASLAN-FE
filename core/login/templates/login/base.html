{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASLAN CORE</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'lib/bootstrap-5.3.3/css/bootstrap.min.css' %}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="{% static 'lib/fontawesome-6.5.2/css/all.min.css' %}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <!-- CSS del login -->
    <link rel="stylesheet" href="{% static 'login/css/style.css' %}">

    {% block assets %}
    {% endblock %}
</head>

<body>

    {% block content_main %}
    {% endblock %}

    <!-- JQuery -->
    <script src="{% static 'lib/jquery-3.7.1/jquery.min.js' %}"></script>

    <!-- Bootstrap -->
    <script src="{% static 'lib/bootstrap-5.3.3/js/bootstrap.bundle.min.js' %}"></script>

    {% block javascript %}
    {% endblock %}

</body>

</html>
